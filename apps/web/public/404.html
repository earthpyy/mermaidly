<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — mermaidly</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #fafaf9;
        --bg-elev: #ffffff;
        --fg: #0a0a0a;
        --fg-muted: #6b6b67;
        --border: #e7e5e1;
        --accent: #ff3670;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0b;
          --bg-elev: #161614;
          --fg: #f5f4f1;
          --fg-muted: #9a9893;
          --border: #232220;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .logo {
        width: 44px;
        height: 44px;
        margin: 0 auto 24px;
        display: block;
        border-radius: 11px;
        box-shadow: 0 1px 2px rgba(10, 10, 10, 0.08);
      }
      .code {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 10px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--fg-muted);
        margin: 0 0 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 8px;
        background: var(--fg);
        color: var(--bg);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF3670" />
            <stop offset="100%" stop-color="#FF6B8A" />
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="22" fill="url(#g)" />
        <path
          d="M18 72 V34 H45 V34 H55 V34 H82 V72 H72 V44 H55 V72 H45 V44 H28 V72 Z"
          fill="white"
        />
      </svg>
      <p class="code">404</p>
      <h1>This page doesn't exist</h1>
      <p>
        The link may be broken or the page may have moved. mermaidly is a
        single-page diagram editor — everything lives on the home page.
      </p>
      <a class="btn" href="/">Back to the editor</a>
    </main>
  </body>
</html>
